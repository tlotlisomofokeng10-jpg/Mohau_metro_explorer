<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA_LSM_2026 Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #f9f9f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #controls {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #e9ecef;
        }

        button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        #chart {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
            padding: 20px;
            position: relative;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 14px;
            text-align: left;
            z-index: 10;
        }

        circle {
            transition: opacity 0.3s, stroke-width 0.1s;
            cursor: pointer;
        }

        .label {
            font-size: 10px;
            fill: #555;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <h2>SA_LSM_2026: Metro Socio-Economic & Density Explorer</h2>
    <div id="controls">
        <button onclick="drawMap('Johannesburg')" class="active" id="btn-Johannesburg">Johannesburg</button>
        <button onclick="drawMap('Pretoria')" id="btn-Pretoria">Pretoria</button>
        <button onclick="drawMap('Durban')" id="btn-Durban">Durban</button>
        <button onclick="drawMap('Cape Town')" id="btn-Cape Town">Cape Town</button>
    </div>

    <div id="chart"></div>
    <div id="tooltip" class="tooltip"></div>

            "Cape Town": [

                { "name": "Nyanga", "lsm": 2, "density": 80000, "lat": -33.9833, "lng": 18.5833 },
                { "name": "Milnerton", "lsm": 8, "density": 5500, "lat": -33.8667, "lng": 18.5000 },
                { "name": "Hout Bay", "lsm": 8, "density": 4500, "lat": -34.0333, "lng": 18.3500 },
                { "name": "Somerset West", "lsm": 9, "density": 3500, "lat": -34.0833, "lng": 18.8500 }
            ]
        };

        const width = 800, height = 600, padding = 60;
        const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
        const tooltip = d3.select("#tooltip");

        const colorScale = d3.scaleSequential(d3.interpolateRdYlBu).domain([1, 10]);

        function drawMap(city) {
            d3.selectAll("button").classed("active", false);
            d3.select(`#btn-${city.replace(' ', '\\ ')}`).classed("active", true);

            const data = cityData[city];
            svg.selectAll("*").remove();

            const xScale = d3.scaleLinear()
                .domain(d3.extent(data, d => d.lng))
                .range([padding, width - padding]);

            const yScale = d3.scaleLinear()
                .domain(d3.extent(data, d => d.lat))
                .range([height - padding, padding]);

            const rScale = d3.scaleSqrt()
                .domain([0, d3.max(data, d => d.density)])
                .range([4, 15]);

            const nodes = svg.selectAll("g")
                .data(data)
                .enter()
                .append("g")
                .attr("transform", d => `translate(${xScale(d.lng)},${yScale(d.lat)})`);

            const circles = nodes.append("circle")
                .attr("r", d => rScale(d.density))
                .attr("fill", d => colorScale(d.lsm))
                .attr("stroke", "#333")
                .attr("stroke-width", 1)
                .attr("opacity", 0.9);

            nodes.append("text")
                .text(d => d.name)
                .attr("class", "label")
                .attr("dy", -12)
                .attr("text-anchor", "middle");

            circles.on("mouseover", function (event, d) {
                d3.selectAll("circle").attr("opacity", 0.15);

                d3.select(this.parentNode).raise();
                d3.select(this)
                    .attr("opacity", 1)
                    .attr("stroke-width", 3)
                    .attr("stroke", "#000")
                    .transition().duration(150)
                    .attr("r", rScale(d.density) * 2.5);

                tooltip.style("opacity", 1)
                    .html(`<strong>${d.name}</strong><br>LSM: ${d.lsm}<br>Density: ${d.density.toLocaleString()}/km²`)
                    .style("left", (event.pageX + 15) + "px")
                    .style("top", (event.pageY - 28) + "px");
            })
                .on("mouseout", function (event, d) {
                    d3.selectAll("circle")
                        .attr("opacity", 0.9)
                        .attr("stroke-width", 1)
                        .transition().duration(150)
                        .attr("r", d => rScale(d.density));

                    tooltip.style("opacity", 0);
                });
        }

        drawMap("Johannesburg");
    </script>
</body>

</html>
